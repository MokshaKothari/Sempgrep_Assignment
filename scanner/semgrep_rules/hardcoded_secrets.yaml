rules:
  - id: hardcoded-secrets
    pattern-either:
      - pattern: $VAR = "api_key"
      - pattern: $VAR = "token"
      - pattern: $VAR = "password"
      - pattern-regex: "^[A-Z_]*\\s*=\\s*['\\\"]?.*(api[_-]?key|token|secret|passwd|password|credentials).*['\\\"]?"
    message: "Possible hardcoded secret detected"
    severity: ERROR
    languages: [python]
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
